name: lint

on: [push, pull_request]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: psf/black@258e7dbf348bc23cb70b8cdf693481c04634ebcc # v26.10.1
        with:
          version: "== 26.3.1"
        