name: lint

on: [push, pull_request]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: psf/black@d2490e24dad33b8f68c77602ee29160de0fea24b # v26.5.0
        with:
          version: "== 26.3.1"
        