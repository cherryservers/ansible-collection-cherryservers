name: lint

on: [push, pull_request]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: psf/black@4f1883b1f15305a0e83a7c87991f46292bf09f85 # v26.10.0
        with:
          version: "== 26.3.1"
        